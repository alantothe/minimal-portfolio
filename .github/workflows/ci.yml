name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly isolated restore evidence. Production R2 drills use the operator
    # command and read-only credentials documented in the recovery runbook.
    - cron: "17 7 * * 0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run check

  recovery-drill:
    name: Encrypted clean-room restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Create, encrypt, restore, and verify fixture
        run: bun run recovery:fixture-drill

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, recovery-drill]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.30.1
      - name: Deploy main
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: >-
          railway up
          --detach
          --project 7575053c-953e-4de2-ab38-b4b88f043086
          --environment production
          --service 9c4d4559-a930-44ee-b152-afcc40d2a36c
          --message "GitHub ${GITHUB_SHA}"
      - name: Wait for healthy deployment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway_deployment_id="$(
            railway deployment list \
              --project 7575053c-953e-4de2-ab38-b4b88f043086 \
              --environment production \
              --service 9c4d4559-a930-44ee-b152-afcc40d2a36c \
              --limit 1 \
              --json |
              jq -er '.[0].id'
          )"

          for railway_poll_attempt in {1..60}; do
            railway_deployment_state="$(
              railway deployment list \
                --project 7575053c-953e-4de2-ab38-b4b88f043086 \
                --environment production \
                --service 9c4d4559-a930-44ee-b152-afcc40d2a36c \
                --limit 1 \
                --json |
                jq -er --arg id "$railway_deployment_id" \
                  '.[] | select(.id == $id) | .status'
            )"

            case "$railway_deployment_state" in
              SUCCESS)
                curl \
                  --fail \
                  --silent \
                  --show-error \
                  --retry 5 \
                  --retry-all-errors \
                  --output /dev/null \
                  https://alanmalpartida.questurian.com/healthz
                exit 0
                ;;
              FAILED|CRASHED|REMOVED)
                railway logs \
                  --project 7575053c-953e-4de2-ab38-b4b88f043086 \
                  --environment production \
                  --service 9c4d4559-a930-44ee-b152-afcc40d2a36c \
                  --deployment \
                  --lines 100 \
                  "$railway_deployment_id"
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for Railway deployment $railway_deployment_id"
          exit 1
