<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Optimize Google Fonts loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Inter:wght@400;500;700&display=block">
    <link rel="stylesheet" href="/public/css/global.css">
    <!-- Preload all page-specific CSS to prevent flashing -->
    <link rel="stylesheet" href="/pages/home/styles.css">
    <link rel="stylesheet" href="/pages/about/styles.css">
    <link rel="stylesheet" href="/pages/projects/styles.css">
    <link rel="stylesheet" href="/pages/blog/styles.css">
    <style>
        /* Fade-up animation for all page content */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Critical: Prevent FOUC by hiding all non-active pages immediately */
        img {
            opacity: 0 !important;
        }

        .page-container {
            display: none !important;
        }
        .page-container.active {
            display: block !important;
            animation: fadeUp 0.5s ease-out;
        }

        /* Critical: Show home page immediately to prevent white flash */
        #home-page.active {
            display: block !important;
        }

        /* Fade up sidebar and nav */
        .sidebar {
            animation: fadeUp 0.5s ease-out;
        }

        /* Fade up main content container - start hidden and offset */
        .content {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.5s ease-out forwards;
        }

        /* Ensure body and container are ready before content loads */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            /* Aggressive sans-serif fallback - avoid any serifs until fonts load */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif !important;
            font-weight: 400;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Initial state for sidebar before animation */
        .sidebar {
            opacity: 0;
            transform: translateY(20px);
        }

        .sidebar {
            animation: fadeUp 0.5s ease-out forwards;
        }

        /* Prevent font size jumping when fonts load */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
        }

        strong, b {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="navbar-header">
                <div class="logo-wrapper">
                    <img class="logo-img" src="/public/logo.png" alt="Logo">
                </div>
                <button class="hamburger" id="hamburger-toggle" aria-label="Toggle navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <nav id="mobile-nav" class="mobile-nav">
                <a href="/" class="nav-link">home</a>
                <a href="/about" class="nav-link">about</a>
                <a href="/projects" class="nav-link">projects</a>
                <a href="/blog" class="nav-link">blog</a>
            </nav>
        </aside>

        <!-- Pre-loaded page containers - toggled instantly on navigation -->
        <main id="app-content" class="content">
            <div id="home-page" class="page-container active"></div>
            <div id="about-page" class="page-container"></div>
            <div id="projects-page" class="page-container"></div>
            <div id="blog-page" class="page-container"></div>
            <div id="blog-post-page" class="page-container"></div>
            <div id="project-page" class="page-container"></div>
        </main>

    </div>
    <!-- Image loader for blur-to-sharp effect -->
    <script src="/public/image-loader.js"></script>
    <!-- SPA router loads ONCE and stays in memory -->
    <script src="/public/spa-router.js" type="module"></script>
</body>
</html>
