<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <!-- Optimize Google Fonts loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/public/css/global.css" />
    <link
      id="page-css"
      rel="stylesheet"
      href="/pages/home/styles.css?v=commits-side-panel-v2"
    />
    <style>
      /* Fade-up animation for all page content */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Critical: Prevent FOUC by hiding all non-active pages immediately */
      .page-container {
        display: none !important;
      }
      .page-container.active {
        display: block !important;
      }

      /* Critical: Show home page immediately to prevent white flash */
      #home-page.active {
        display: block !important;
      }

      /* Ensure body and container are ready before content loads */
      html,
      body {
        height: 100%;
        overflow: hidden;
        background-color: #0a0a0a;
        color: #ffffff;
        /* Aggressive sans-serif fallback - avoid any serifs until fonts load */
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", sans-serif !important;
        font-weight: 400;
      }

      /* Hidden until content is loaded, then revealed by .ready class */
      .container {
        display: flex;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
        opacity: 0;
      }

      .container.ready {
        animation: fadeUp 0.3s cubic-bezier(0, 0, 0.2, 1) forwards;
      }

      /* Prevent font size jumping when fonts load */
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: 700;
      }

      strong,
      b {
        font-weight: 700;
      }
    </style>
    <noscript
      ><style>
        .container {
          opacity: 1 !important;
          animation: none !important;
        }
      </style></noscript
    >
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="navbar-header">
          <div class="logo-wrapper">
            <img
              class="logo-img"
              src="/public/logo.png"
              alt="Alan Malpartida"
              width="337"
              height="203"
            />
          </div>
          <button
            class="menu-toggle"
            id="mobile-menu-toggle"
            type="button"
            aria-controls="mobile-nav"
            aria-expanded="false"
          >
            Menu
          </button>
        </div>
        <nav id="mobile-nav" class="mobile-nav">
          <a href="/" class="nav-link">home</a>
          <a href="/about" class="nav-link">about</a>
          <a href="/projects" class="nav-link">projects</a>
          <a href="/blog" class="nav-link">blog</a>
        </nav>
      </aside>

      <!-- Pre-loaded page containers - toggled instantly on navigation -->
      <main id="app-content" class="content">
        <div id="home-page" class="page-container active"></div>
        <div id="about-page" class="page-container"></div>
        <div id="projects-page" class="page-container"></div>
        <div id="blog-page" class="page-container"></div>
        <div id="blog-post-page" class="page-container"></div>
        <div id="project-page" class="page-container"></div>
      </main>
      <!-- Cached two-cue routers require this ID before updating the next cue. -->
      <span
        id="mobile-page-cue-previous"
        aria-hidden="true"
        hidden
        style="display: none !important"
      ></span>
      <span
        id="mobile-page-cue-next"
        class="mobile-page-cue mobile-page-cue--next"
        aria-hidden="true"
      ></span>
    </div>
    <!-- Image loader for blur-to-sharp effect -->
    <script src="/public/image-loader.js"></script>
    <!-- SPA router loads ONCE and stays in memory -->
    <script src="/public/spa-router.js?v=media" type="module"></script>
  </body>
</html>
